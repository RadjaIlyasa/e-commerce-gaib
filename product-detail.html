
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0C2C55" />
  <title>Detail Produk — Pasar Gaib</title>

  <link rel="icon" href="asset/logo.jpeg" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />

  <style>
    .detail-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px 72px;
    }

    .detail-back {
      display: inline-block;
      margin-bottom: 24px;
      text-decoration: none;
    }

    .detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 40px;
      align-items: start;
    }

    .detail-image-wrap {
      overflow: hidden;
      border-radius: 12px;
      background: #0C2C55;
      min-height: 300px;
    }

    .detail-image {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .detail-category {
      margin: 0 0 12px;
      opacity: 0.75;
    }

    .detail-title {
      margin: 0 0 16px;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
    }

    .detail-price {
      font-size: 1.6rem;
      font-weight: 700;
      margin: 0 0 16px;
    }

    .detail-stock,
    .detail-description {
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .detail-quantity {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }

    .detail-quantity button {
      width: 40px;
      height: 40px;
      cursor: pointer;
    }

    .detail-quantity input {
      width: 64px;
      height: 40px;
      text-align: center;
    }

    .detail-add-button {
      width: 100%;
      min-height: 46px;
      cursor: pointer;
      padding: 12px 20px;
    }

    .detail-add-button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .detail-message {
      margin-top: 16px;
      line-height: 1.6;
    }

    .detail-loading {
      padding: 40px 0;
      text-align: center;
    }

    @media (max-width: 700px) {
      .detail-layout {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .detail-page {
        padding: 24px 16px 48px;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav class="navbar" role="navigation" aria-label="Navigasi utama">
      <div class="container navbar__inner">
        <a href="index.html" class="navbar__logo"
           aria-label="Pasar Gaib — Beranda">
          <img src="asset/logo.jpeg" alt="Logo Pasar Gaib"
               class="navbar__logo-img" width="38" height="38" />
          <div class="navbar__logo-text">
            <span class="navbar__logo-name">Pasar Gaib</span>
            <span class="navbar__logo-sub">Artefak Mistis Nusantara</span>
          </div>
        </a>

        <ul class="navbar__menu" role="list">
          <li><a class="navbar__link" href="index.html">Beranda</a></li>
          <li><a class="navbar__link" href="products.html">Katalog</a></li>
        </ul>

        <a href="cart.html" class="navbar__cart navbar__cart--desktop"
           aria-label="Keranjang belanja">
          <svg width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               aria-hidden="true">
            <circle cx="8" cy="21" r="1"/>
            <circle cx="19" cy="21" r="1"/>
            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 002 1.58h9.78a2 2 0 001.95-1.57l1.65-7.43H5.12"/>
          </svg>
          Keranjang <span class="navbar__cart-badge">0</span>
        </a>

        <button class="navbar__hamburger"
                aria-label="Buka menu"
                aria-expanded="false"
                aria-controls="mobile-menu">
          <span class="navbar__hamburger-line"></span>
          <span class="navbar__hamburger-line"></span>
          <span class="navbar__hamburger-line"></span>
        </button>
      </div>
    </nav>

    <nav class="navbar__mobile-menu" id="mobile-menu"
         aria-label="Menu mobile">
      <a class="navbar__mobile-link" href="index.html">Beranda</a>
      <a class="navbar__mobile-link" href="products.html">Katalog</a>
      <a class="navbar__mobile-cart" href="cart.html">
        Keranjang <span class="navbar__cart-badge">0</span>
      </a>
    </nav>
  </header>

  <main class="detail-page">
    <a href="products.html" class="detail-back">
      &larr; Kembali ke katalog
    </a>

    <div id="detail-content" class="detail-loading" aria-live="polite">
      Memuat detail produk...
    </div>
  </main>

  <script type="module" src="assets/js/product-detail.js"></script>
</body>
</html>
